name: Automatic update dependencies

on:
  schedule:
    - cron: '0 9 * * 6' # Every Saturday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    uses: ni/open-source/.github/workflows/reusable-vipm-update.yml@actions
    with:
      working_directory: Tooling/deployment
      manifest_filename: runner_dependencies.toml
      lock_filename: runner_dependencies.lock
      include_dev_dependencies: false
      labview_version: "2021"
      labview_bitness: "64"
      base_branch: develop
      pr_branch: automation/vipm-dependency-update
    secrets:
      VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
      VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
      VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
