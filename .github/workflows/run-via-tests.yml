name: (Work In Progress) Run VIA tests (GitHub Hosted)

on:
  # TODO: Uncomment the original triggers below when ready for full deployment
  pull_request:
    branches:
      - feature/github-actions-cicd  # Temporary: only run on this branch
  #     - main
  #     - develop
  #     - release/*
  #     - feature/*
  #     - hotfix/*
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review

  push:
    branches:
      - feature/github-actions-cicd  # Temporary: only run on this branch
      # - main
      # - develop
      # - release/*
      # - hotfix/*
      # - feature/*

  workflow_dispatch:

jobs:
  run-via-tests:
    name: Run VI Analyzer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history

      - name: Generate VI Analyzer Config
        uses: ./.github/actions/generate_viancfg
        with:
          template-path: '.github/actions/generate_viancfg/via_template_linux.viancfg'
          output-path: 'generated-config.viancfg'
          base-branch: origin/${{ github.event.pull_request.base.ref || 'develop' }}

      - name: Upload Generated Config (Debug) # TODO: Delete this step later
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-viancfg
          path: generated-config.viancfg
          retention-days: 7
          if-no-files-found: ignore

      - name: Check if config was generated
        id: check-config
        run: |
          if [ -f "generated-config.viancfg" ]; then
            echo "config_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No LabVIEW files changed; skipping VI Analyzer tests."
            echo "config_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull Docker Image
        if: steps.check-config.outputs.config_exists == 'true'
        run: docker pull nationalinstruments/labview:2025q3patch1-linux

      - name: Run VI Analyzer tests
        if: steps.check-config.outputs.config_exists == 'true'
        run: |
          set +e  # Disable exit on error temporarily

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            nationalinstruments/labview:2025q3patch1-linux \
            bash -c "cd /workspace && chmod +x .github/workflows/run-via.sh && ./.github/workflows/run-via.sh"

          VIA_EXIT_CODE=$?
          set -e  # Re-enable exit on error
    
          if [ ! -f "vi-analyzer-report.htm" ]; then
            echo "No VI Analyzer report found"
            exit $VIA_EXIT_CODE
          fi
          
          echo ""
          echo "=================================================="
          echo " VI Analyzer Results"
          echo "=================================================="
          echo ""
          
          # Extract results using grep and sed
          VIS_ANALYZED=$(grep -oP 'VIs Analyzed</td><td>\K[0-9]+' vi-analyzer-report.htm || echo "0")
          TESTS_RUN=$(grep -oP 'Total Tests Run</td><td>\K[0-9]+' vi-analyzer-report.htm || echo "0")
          PASSED=$(grep -oP 'Passed Tests</td><td>\K[0-9]+' vi-analyzer-report.htm || echo "0")
          FAILED=$(grep -oP 'Failed Tests</td><td>\K[0-9]+' vi-analyzer-report.htm || echo "0")
          SKIPPED=$(grep -oP 'Skipped Tests</td><td>\K[0-9]+' vi-analyzer-report.htm || echo "0")
          
          echo "VIs Analyzed:   $VIS_ANALYZED"
          echo "Total Tests:    $TESTS_RUN"
          echo "Passed:         $PASSED"
          echo "Failed:         $FAILED"
          echo "Skipped:        $SKIPPED"
          echo ""
          
          if [ "$FAILED" -gt 0 ]; then
            echo "=================================================="
            echo " Failed Tests Summary"
            echo "=================================================="
            
            # Extract failed test details
            awk '
              /<a name="fail">Failed Tests/,/<a name="err">Testing Errors/ {
                if (match($0, /<b>([^<]+\.vi)<\/b>/, arr)) {
                  if (vi_name) print ""
                  vi_name = arr[1]
                  printf "\n %s\n", vi_name
                  print "---"
                }
                if (match($0, /<tr><td>([^<]+)<\/td><td>([^<]+)<\/td><\/tr>/, arr)) {
                  test_name = arr[1]
                  failure_msg = arr[2]
                  printf " %s\n     → %s\n", test_name, failure_msg
                }
              }
            ' vi-analyzer-report.htm
            
            echo ""
            echo "=================================================="
            echo "See full report in artifacts for complete details."
            echo "=================================================="
            exit $VIA_EXIT_CODE
          else
            echo " All tests passed!"
            echo "=================================================="
          fi

          exit $VIA_EXIT_CODE

      - name: Upload VI Analyzer Report
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail
        with:
          name: vi-analyzer-report
          path: vi-analyzer-report.htm
          retention-days: 7