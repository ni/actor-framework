name: (Work In Progress) Run VIA tests (GitHub Hosted)

on:
  # TODO: Uncomment the original triggers below when ready for full deployment
  pull_request:
    branches:
      - feature/github-actions-cicd  # Temporary: only run on this branch
  #     - main
  #     - develop
  #     - release/*
  #     - feature/*
  #     - hotfix/*
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review

  push:
    branches:
      - feature/github-actions-cicd  # Temporary: only run on this branch
      # - main
      # - develop
      # - release/*
      # - hotfix/*
      # - feature/*

  workflow_dispatch:

jobs:
  run-via-tests:
    name: Run VI Analyzer tests
    runs-on: ubuntu-latest
    container:
      image: nationalinstruments/labview:2025q3patch1-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run VI Analyzer tests
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # Resolve paths
          # TODO: Make the paths configurable via inputs
          ABSOLUTE_CONFIG="${{ github.workspace }}/Core/ActorFramework/Actor"
          ABSOLUTE_REPORT="${{ github.workspace }}/vi-analyzer-report.htm"
          
          # Run VI Analyzer
          LabVIEWCLI \
            -LabVIEWPath "/usr/local/natinst/LabVIEW-2025-64/labview" \
            -OperationName RunVIAnalyzer \
            -ConfigPath "$ABSOLUTE_CONFIG" \
            -ReportPath "$ABSOLUTE_REPORT" \
            -ReportSaveType HTML \
            -Headless

      - name: Upload VI Analyzer Report
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail
        with:
          name: vi-analyzer-report
          path: ${{ github.workspace }}/vi-analyzer-report.htm
          retention-days: 7