name: Run VIA tests

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - main
      - develop
      - release/*
      - hotfix/*
      - feature/*

  workflow_dispatch:

jobs:
  run-via-tests:
    name: Run VI Analyzer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history

      # TEMPORARY VIPM VALIDATION: install and activate Linux VIPM inside the
      # LabVIEW container before VI Analyzer. A failure stops this job, so the
      # analyzer action below runs only after VIPM validation succeeds.
      - name: Validate VIPM license
        shell: bash
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --env "VIPM_SERIAL_NUMBER=$VIPM_SERIAL_NUMBER" \
            --env "VIPM_FULL_NAME=$VIPM_FULL_NAME" \
            --env "VIPM_EMAIL=$VIPM_EMAIL" \
            nationalinstruments/labview:latest-linux \
            bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y ca-certificates wget
              wget -O /tmp/vipm.deb https://traffic.libsyn.com/secure/jkinc/vipm_26.3.1-4025_amd64.deb
              dpkg -i /tmp/vipm.deb || apt-get install -f -y
              echo "VIPM version:"
              vipm --version
              test -n "$VIPM_SERIAL_NUMBER"
              test -n "$VIPM_FULL_NAME"
              test -n "$VIPM_EMAIL"
              vipm activate --serial-number "$VIPM_SERIAL_NUMBER" --name "$VIPM_FULL_NAME" --email "$VIPM_EMAIL"
              vipm refresh
              echo "Installing LUnit CLI package to validate VIPM access:"
              vipm install astemes_lib_lunit_cli \
                --labview-version 2026 \
                --labview-bitness 64
              echo "VIPM license validation succeeded."
            '

      - name: Run VI Analyzer tests
        uses: ni/open-source/via-lv-docker@actions
        with:
          config_path: ${{ github.event_name == 'workflow_dispatch' && '.github/via_config/Actor_Framework.viancfg' || '' }}
          base_branch: origin/${{ github.event.pull_request.base.ref || 'develop' }}
          labview_version: 'latest-linux'

      - name: Upload VI Analyzer Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vi-analyzer-report
          path: vi-analyzer-report.htm
          retention-days: 7