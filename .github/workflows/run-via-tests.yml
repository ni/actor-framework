name: (Work In Progress) Run VIA tests (GitHub Hosted)

on:
  # TODO: Uncomment the original triggers below when ready for full deployment
  pull_request:
    branches:
      - feature/github-actions-cicd  # Temporary: only run on this branch
  #     - main
  #     - develop
  #     - release/*
  #     - feature/*
  #     - hotfix/*
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - ready_for_review

  push:
    branches:
      - feature/github-actions-cicd  # Temporary: only run on this branch
      # - main
      # - develop
      # - release/*
      # - hotfix/*
      # - feature/*

  workflow_dispatch:

jobs:
  run-via-tests:
    name: Run VI Analyzer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Docker Image
        run: docker pull nationalinstruments/labview:2025q3patch1-linux

      - name: Run VI Analyzer tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            nationalinstruments/labview:2025q3patch1-linux \
            bash -c "cd /workspace && chmod +x .github/workflows/run-via.sh && ./.github/workflows/run-via.sh"

      - name: Upload VI Analyzer Report
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail
        with:
          name: vi-analyzer-report
          path: vi-analyzer-report.htm
          retention-days: 7