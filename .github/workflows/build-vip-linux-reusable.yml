name: Build AF VIP with shared ni/open-source workflow

on:
  # Merges land as pushes to main; no pull_request trigger.
  push:
    branches:
      - main
      # TEMP: remove before merging; enables a one-off test run.
      - users/amrutha/linux-vip-build
  workflow_dispatch:
    inputs:
      labview_version:
        description: NI LabVIEW container version
        required: true
        default: 2026q1
        type: string

permissions:
  actions: read
  contents: read

jobs:
  create-distribution:
    uses: ./.github/workflows/create-distribution-artifact.yml
    with:
      upload-artifact: true

  build-vip:
    name: Build VIP with shared workflow
    needs: create-distribution
    # TODO: switch to @actions once ni/open-source merges build-vip-docker-linux.
    uses: ni/open-source/.github/workflows/reusable-build-vip-linux.yml@users/amrutha/build-vip-docker-linux
    with:
      labview_version: ${{ inputs.labview_version || '2026q1' }}
      download_artifact_name: actor-framework-distribution
      download_path: .af-distribution
      pre_build_script: pipeline/scripts/Prepare-AF-Linux-Vip.sh
      vipb_path: builds/logs/vip-linux/Actor Framework.linux.vipb
      source_directory: /tmp/af-source/Core
      desktop_liveliness_timeout: '900'
      vip_artifact_name: actor-framework-vip-shared-${{ github.run_id }}
      logs_artifact_name: actor-framework-vip-shared-logs-${{ github.run_id }}
    secrets:
      VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
      VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
      VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
