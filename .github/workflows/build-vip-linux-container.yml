name: Build Actor Framework VIP in NI Linux Container

on:
  push:
    branches:
      - users/amrutha/vip_build
  workflow_dispatch:
    inputs:
      labview_version:
        description: NI LabVIEW container version
        required: true
        default: 2026q1
        type: string

permissions:
  contents: read

jobs:
  create-distribution:
    uses: ./.github/workflows/create-distribution-artifact.yml
    with:
      upload-artifact: true

  build-vip:
    name: Build VIP in NI LabVIEW Linux container
    needs: create-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download distribution from this run
        uses: actions/download-artifact@v7
        with:
          name: actor-framework-distribution
          path: ${{ runner.temp }}/actor-framework-distribution

      - name: Prepare packaging inputs without repository AF source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputsRoot = Join-Path $env:RUNNER_TEMP 'actor-framework-vip-inputs'
          New-Item -ItemType Directory -Force -Path "$inputsRoot/Core", "$inputsRoot/Tooling/deployment", "$inputsRoot/pipeline/scripts" | Out-Null
          Copy-Item -LiteralPath 'Core/Actor Framework 2024 for 2020.vipb' -Destination "$inputsRoot/Core/"
          Copy-Item -LiteralPath 'Core/Install Support' -Destination "$inputsRoot/Core/" -Recurse
          Copy-Item -LiteralPath 'LICENSE.txt' -Destination $inputsRoot
          Copy-Item -LiteralPath 'Tooling/deployment/runner_dependencies.toml' -Destination "$inputsRoot/Tooling/deployment/"
          Copy-Item -LiteralPath 'pipeline/scripts/Build-VIP-Linux-Container.sh' -Destination "$inputsRoot/pipeline/scripts/"

      - name: Build VIP in container
        shell: bash
        env:
          LABVIEW_VERSION: ${{ inputs.labview_version || '2026q1' }}
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: |
          set -euo pipefail
          image="nationalinstruments/labview:${LABVIEW_VERSION}-linux"
          artifact_root="$RUNNER_TEMP/actor-framework-vip-build"
          mkdir -p "$artifact_root/logs" "$artifact_root/Builds"

          docker pull "$image"
          docker run --rm \
            --mount "type=bind,source=${RUNNER_TEMP}/actor-framework-vip-inputs,target=/build-inputs,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/actor-framework-distribution,target=/distribution,readonly" \
            --mount "type=bind,source=${artifact_root},target=/artifacts" \
            --workdir /build-inputs \
            --env LABVIEW_VERSION \
            --env VIPM_SERIAL_NUMBER \
            --env VIPM_FULL_NAME \
            --env VIPM_EMAIL \
            "$image" \
            bash /build-inputs/pipeline/scripts/Build-VIP-Linux-Container.sh

      - name: Upload built VIP
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: actor-framework-vip-${{ inputs.labview_version || '2026q1' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/actor-framework-vip-build/Builds/*.vip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build, install, and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: actor-framework-vip-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/actor-framework-vip-build/logs/**
          if-no-files-found: warn
          retention-days: 14